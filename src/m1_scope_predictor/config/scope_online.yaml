scope_predictor:
  ros__parameters:
    use_sim_time: true
    scan_topic: /scan
    odom_topic: /odom
    ground_truth_topic: /ground_truth/odom
    base_frame: base_footprint
    odom_frame: odom
    model_path: /home/xinlei/Data/SCOPE-repro/reference/scope/model/scope_model.pth
    device: cuda
    seed: 1337
    buffer_duration: 3.0
    scheduler_rate: 10.0
    scan_tolerance: 0.05
    # Keep the online forecast local for the dense, continuously moving demo.
    # The frozen model is unchanged; this only limits how far its prediction
    # is projected into the rolling local costmap.
    prediction_horizon_steps: 2
    num_samples: 4
    max_prediction_age: 1.0
    evaluator_enabled: false
    occupancy_threshold: 0.5
