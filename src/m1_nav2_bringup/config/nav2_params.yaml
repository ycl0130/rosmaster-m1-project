controller_server:
  ros__parameters:
    use_sim_time: true
    # Conservative baseline for straight-line tracking. Increase the speed
    # envelope only after the physics and Nav2 regression tests pass.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    current_goal_checker: general_goal_checker
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      # M1 is used for ordinary navigation rather than docking.  Avoid
      # forcing a collision-prone terminal rotation when the position is
      # already reached near an obstacle.
      yaw_goal_tolerance: 0.40
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Launch retains native MPPI when this is off. Shadow/active replace
      # only this plugin boundary with HybridController, which instantiates
      # the same official MPPI implementation using the untouched settings.
      local_fast2d:
        mode: off
        update_rate: 8.0
        path_stale_timeout: 0.5
        lookahead_distance: 2.0
        local_costmap_cost_weight: 2.0
        allow_unknown: true
        # Phase 5 only selects which immutable Fast2D candidate is forwarded;
        # these do not alter Fast2D generation or MPPI optimization.
        selector_w_mean: 1.0
        selector_w_max: 1.0
        selector_w_high: 0.5
        candidate_baseline_preference: 0.05
        candidate_switch_margin: 0.10
        candidate_switch_penalty: 0.10
        route_match_threshold: 0.30
        minimum_coverage_ratio: 0.25
        minimum_valid_queries: 3
        prediction_fresh_timeout: 1.0
      # Phase 6B is deliberately default-off. When enabled through the
      # HybridController active mode, stock MPPI samples correction controls
      # around the selected timed reference and applies a hard time-indexed
      # position tube. The first experiment retains the frozen 500x40x0.05x1
      # MPPI compute profile.
      restricted_mppi:
        enabled: false
        delta_vx_max: 0.10
        delta_vy_max: 0.10
        delta_wz_max: 0.16
        position_tube_radius: 0.15
        phase_search_back_s: 0.20
        phase_search_forward_s: 0.35
        max_phase_lead_s: 0.15
        phase_projection_resolution_s: 0.01
        consider_footprint: true
      # M1 is mecanum-drive, so MPPI samples longitudinal, lateral and
      # rotational velocity together using the omni motion model.
      motion_model: Omni
      time_steps: 30
      model_dt: 0.067
      batch_size: 200
      iteration_count: 1
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.5
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      wz_max: 0.8
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.5
      transform_tolerance: 0.2
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.50
      GoalCritic:
        enabled: true
        cost_weight: 8.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.50
      PathAlignCritic:
        enabled: true
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_weight: 2.0
      TwirlingCritic:
        enabled: true
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      # Keep the internal map loop at 10 Hz while requesting complete
      # diagnostic/RViz snapshots at 20 Hz. The effective rate is bounded by
      # the map-update loop and is measured in the runtime experiment.
      publish_frequency: 20.0
      transform_tolerance: 0.3
      rolling_window: true
      # Give the rolling local map enough look-ahead for the GPU LiDAR while
      # keeping it substantially smaller than the global map.
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.15,-0.12],[-0.15,0.12],[0.15,0.12],[0.15,-0.12]]"
      footprint_padding: 0.02
      # Snapshot layers are Phase 6C diagnostics only: they read and publish
      # the master grid at each boundary but never alter bounds or costs.
      plugins: [obstacle_layer, obstacle_snapshot, scope_layer, scope_snapshot, inflation_layer, master_snapshot]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          # The scan is measured in laser_scan_link (zero-offset from
          # laser_Link), but the
          # obstacle observations are transformed into odom at about z=0.175 m.
          # Keep this source-level limit explicit so the inherited/default
          # value of 0.0 cannot discard every laser return.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.05
          raytrace_max_range: 4.5
          raytrace_min_range: 0.05
          observation_persistence: 0.0
          expected_update_rate: 0.25
          # Keep the default strict: GPU scans are finite in the measured
          # bridge path, so +Inf-as-clearing is not enabled without evidence.
          inf_is_valid: false
      obstacle_snapshot:
        plugin: m1_scope_costmap_layer::MasterSnapshotLayer
        enabled: true
        topic: /local_costmap/debug/after_obstacle
        publish_rate: 20.0
      scope_layer:
        plugin: m1_scope_costmap_layer::ScopeLayer
        enabled: false
        prediction_topic: /scope/prediction
        uncertainty_topic: /scope/uncertainty
        # Predictions augment, but never replace, measured scan obstacles.
        # Keep only near-term, high-confidence risk in this dense demo.
        low_threshold: 0.45
        lethal_threshold: 0.85
        # Do not promote distant, uncertain forecast cells to hard obstacles.
        # Measured LaserScan obstacles remain hard obstacles in obstacle_layer.
        uncertainty_gain: 0.5
        uncertainty_encoding_scale: 0.5
        medium_cost: 200
        # Phase 6C: a t+0.2 s forecast is soft MPPI risk, not a timeless
        # lethal collision wall across the 1.943 s controller horizon.
        temporal_prediction_hard_obstacle: false
        stale_timeout: 0.5
      scope_snapshot:
        plugin: m1_scope_costmap_layer::MasterSnapshotLayer
        enabled: true
        topic: /local_costmap/debug/after_scope
        publish_rate: 20.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # Keep a small cost buffer around observed obstacles.
        inflation_radius: 0.4
      master_snapshot:
        plugin: m1_scope_costmap_layer::MasterSnapshotLayer
        enabled: true
        topic: /local_costmap/debug/after_inflation
        publish_rate: 20.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.15,-0.12],[-0.15,0.12],[0.15,0.12],[0.15,-0.12]]"
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          observation_persistence: 0.0
          expected_update_rate: 0.25
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # Keep a planner fallback close to the requested goal.  A 0.30 m
      # replacement can look like a valid path in RViz while leaving the
      # controller with a different terminal pose than the user selected.
      tolerance: 0.10
      use_astar: false
      allow_unknown: true
      # Phase 1A Fast2D smoke-planner parameters.  They are inert when
      # GridBased resolves to NavFn and are read only by Fast2DPlanner.
      path_resolution: 0.05
      max_velocity_x: 0.45
      max_velocity_y: 0.45
      max_accel_x: 0.60
      max_accel_y: 0.60
      primitive_duration: 0.25
      collision_check_dt: 0.05
      collision_check_distance: 0.05
      position_resolution: 0.10
      velocity_resolution: 0.10
      goal_position_tolerance: 0.15
      goal_velocity_tolerance: 0.20
      search_timeout_ms: 200
      max_expansions: 100000
      time_cost_weight: 1.0
      control_cost_weight: 0.10
      odom_topic: /odom
      odom_timeout: 0.50

smoother_server:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: CLOSED_LOOP
    # Demo-safe envelope: retain lateral avoidance while giving the local
    # costmap and safety chain more time around moving obstacles.
    max_velocity: [0.25, 0.25, 0.4]
    min_velocity: [-0.25, -0.25, -0.4]
    max_accel: [0.4, 0.4, 0.7]
    max_decel: [-0.5, -0.5, -0.8]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /m1/cmd_vel_raw
    transform_tolerance: 0.5
    source_timeout: 0.30
    base_shift_correction: true
    # Do not keep publishing a prior emergency stop after the scan is clear.
    stop_pub_timeout: 0.25
    polygons: [PolygonStop]
    PolygonStop:
      type: polygon
      # M1 footprint (0.30 x 0.24 m) plus the same 0.02 m padding used by
      # the Costmaps. Stop only on imminent body intrusion, not nearby motion.
      points: [0.30, 0.25, 0.30, -0.25, -0.30, -0.25, -0.30, 0.25]
      action_type: stop
      max_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
